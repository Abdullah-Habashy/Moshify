name: Build WindowLayout (Windows)

on:
  push:
    branches: [claude/desktop-window-manager-eki36s]
    paths:
      - 'tools/window-layout/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/window-layout

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s tests -v

      # The only place the ctypes layer runs for real: monitor enumeration,
      # the coordinate conversion, and moving an actual window around.
      - name: Windows backend, on a real desktop
        run: python -m unittest tests.test_win_smoke -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the exe
        run: python -m PyInstaller build/WindowLayout.spec --noconfirm --clean

      - name: Check the exe starts
        shell: pwsh
        run: |
          .\dist\WindowLayout.exe list
          if ($LASTEXITCODE -ne 0) { throw "WindowLayout.exe list exited $LASTEXITCODE" }
          $size = (Get-Item .\dist\WindowLayout.exe).Length
          Write-Host "WindowLayout.exe = $([math]::Round($size/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowLayout-exe
          path: tools/window-layout/dist/WindowLayout.exe
          if-no-files-found: error

      - name: Publish a downloadable build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "winlayout-v1.0.0-b${{ github.run_number }}"
          gh release create $tag dist/WindowLayout.exe `
            --target ${{ github.sha }} `
            --title "WindowLayout 1.0.0 (build ${{ github.run_number }})" `
            --notes "نزّل WindowLayout.exe ودوس عليه دبل كليك. مش محتاج بايثون ولا تسطيب." `
            --prerelease
