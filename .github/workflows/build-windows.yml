name: Build WindowLayout (Windows)

on:
  push:
    branches: [claude/desktop-window-manager-eki36s]
    paths:
      - 'tools/window-layout/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/window-layout

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s tests -v

      # The only place the ctypes layer runs for real: monitor enumeration,
      # the coordinate conversion, and moving an actual window around.
      - name: Windows backend, on a real desktop
        run: python -m unittest tests.test_win_smoke -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the exe
        run: python -m PyInstaller build/WindowLayout.spec --noconfirm --clean

      - name: Check the executables run
        shell: pwsh
        run: |
          # The windowed exe returns to the shell immediately and never sets an
          # exit code, so the console build is the one a script can check.
          $out = Join-Path $env:RUNNER_TEMP 'cli-out.txt'
          $cli = Start-Process -FilePath .\dist\winlayout-cli.exe -ArgumentList 'list' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          if ($cli.ExitCode -ne 0) { throw "winlayout-cli.exe list exited $($cli.ExitCode)" }
          # Redirected output is where Arabic silently degrades to '?', so
          # check the real characters survived rather than just the exit code.
          $text = Get-Content $out -Raw -Encoding utf8
          Write-Host $text
          if ($text -notmatch 'مافيش') { throw "Arabic output was mangled" }
          $app = Start-Process -FilePath .\dist\WindowLayout.exe -ArgumentList 'list' `
            -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "WindowLayout.exe list exited $($app.ExitCode)" }
          Get-ChildItem .\dist\*.exe | ForEach-Object {
            Write-Host "$($_.Name) = $([math]::Round($_.Length/1MB,1)) MB"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WindowLayout-exe
          path: tools/window-layout/dist/*.exe
          if-no-files-found: error

      - name: Publish a downloadable build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "winlayout-v1.0.0-b${{ github.run_number }}"
          gh release create $tag dist/WindowLayout.exe dist/winlayout-cli.exe `
            --target ${{ github.sha }} `
            --title "WindowLayout 1.0.0 (build ${{ github.run_number }})" `
            --notes-file build/release-notes.md `
            --prerelease
